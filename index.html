<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110e0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DorIAn APP">
<title>DorIAn APP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #110e0c;
    --bg-deep: #0c0b0a;
    --card: #181410;
    --card-2: #221c17;
    --line: #3a3128;
    --line-soft: #2c261f;
    --text: #f7f1e8;
    --muted: #e4d5c4;
    --soft: #cbbba8;
    --amber: #ff9f1a;
    --amber-2: #ffb03a;
    --amber-deep: #e07d00;
    --ink: #1a1008;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html { background: var(--bg-deep); }

  body {
    margin: 0;
    min-height: 100dvh;
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(255, 159, 26, 0.22), transparent 60%),
      var(--bg-deep);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 17px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  :focus { outline: none; }

  :focus-visible {
    outline: 3px solid #ffc14d;
    outline-offset: 2px;
  }

  .app {
    width: min(100%, 480px);
    min-height: 100dvh;
    margin: 0 auto;
    padding: 0 16px calc(32px + env(safe-area-inset-bottom));
    background:
      linear-gradient(180deg, rgba(255, 159, 26, 0.08), transparent 240px),
      var(--bg);
  }

  .ident {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: calc(18px + env(safe-area-inset-top)) 0 16px;
  }

  .orb {
    width: 60px;
    height: 60px;
    flex: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 32% 28%, #ffd27a 0%, #ff9f1a 46%, #e06a00 100%);
    color: var(--ink);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    box-shadow: 0 10px 28px rgba(255, 140, 20, 0.28);
  }

  h1 {
    margin: 0;
    font-size: 38px;
    line-height: 0.95;
    letter-spacing: -0.045em;
    font-weight: 800;
  }

  h1 .ia { color: var(--amber); }

  .goal {
    margin: 6px 0 0;
    font-size: 16px;
    line-height: 1.3;
    color: var(--muted);
  }

  .week {
    position: sticky;
    top: env(safe-area-inset-top);
    z-index: 5;
    margin: 0 -16px;
    padding: 10px 16px 12px;
    background: rgba(17, 14, 12, 0.94);
    border-bottom: 1px solid var(--line-soft);
    backdrop-filter: blur(16px);
  }

  .week::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: calc(-1 * env(safe-area-inset-top));
    height: env(safe-area-inset-top);
    background: rgba(17, 14, 12, 0.94);
  }

  .week-label {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
  }

  .days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }

  .day {
    min-width: 0;
    min-height: 64px;
    padding: 7px 0 6px;
    border: 0;
    border-radius: 14px;
    background: var(--card-2);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .day .dow {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--muted);
    line-height: 1;
  }

  .day .num {
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .day[aria-current="date"]:not([aria-selected="true"]) {
    box-shadow: inset 0 0 0 2px var(--amber);
  }

  .day[aria-selected="true"] {
    background: var(--amber);
    color: var(--ink);
  }

  .day[aria-selected="true"] .dow { color: #4a3008; }

  .when {
    margin: 18px 0 10px;
    font-size: 16px;
    font-weight: 700;
    color: var(--muted);
  }

  .tags {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .kicker {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber-2);
  }

  .chip {
    margin: 0;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--amber);
    color: var(--ink);
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
  }

  h2 {
    margin: 10px 0 0;
    font-size: 30px;
    line-height: 1.12;
    letter-spacing: -0.03em;
    font-weight: 800;
  }

  .lede {
    margin: 8px 0 0;
    font-size: 17px;
    line-height: 1.45;
    color: var(--muted);
  }

  .bar {
    margin-top: 16px;
    height: 10px;
    border-radius: 999px;
    background: #2a241c;
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--amber-deep), #ffc14d);
    transition: width 200ms ease;
  }

  .count {
    margin: 8px 0 0;
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
  }

  .lifts {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 16px;
  }

  .group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: inset 4px 0 0 #3a3128;
  }

  .group.is-complete {
    border-color: rgba(255, 159, 26, 0.5);
    box-shadow: inset 4px 0 0 var(--amber);
  }

  .set {
    width: 100%;
    min-height: 72px;
    padding: 8px 10px 8px 12px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    column-gap: 8px;
    align-items: center;
    border-bottom: 1px solid var(--line-soft);
    background: transparent;
  }

  .group .set:last-child { border-bottom: 0; }

  .set.is-done { background: rgba(255, 159, 26, 0.1); }

  .set-toggle {
    min-width: 0;
    min-height: 64px;
    padding: 4px 2px 4px 4px;
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) 44px;
    column-gap: 10px;
    align-items: center;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 12px;
  }

  .set-toggle:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 3px #ffc14d;
  }

  .set-toggle:active { background: rgba(255, 159, 26, 0.16); }

  .weight {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding-right: 2px;
  }

  .weight input {
    width: 4.6em;
    min-height: 52px;
    padding: 8px 8px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #2c241c;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: center;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .weight input::-webkit-outer-spin-button,
  .weight input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .weight input::placeholder {
    color: #8d7353;
    font-weight: 700;
    opacity: 1;
  }

  .weight input:focus {
    border-color: var(--amber);
    background: #33291f;
  }

  .weight .unit {
    font-size: 14px;
    font-weight: 800;
    color: var(--soft);
    min-width: 1.6em;
  }

  .n {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: #2c241c;
    color: var(--amber-2);
    font-size: 16px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .set.is-done .n {
    background: var(--amber);
    color: var(--ink);
  }

  .ex {
    display: block;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.015em;
  }

  .rx {
    display: block;
    margin-top: 3px;
    font-size: 16px;
    line-height: 1.3;
    color: var(--soft);
  }

  .set.is-done .rx { color: var(--muted); }

  .tick {
    width: 36px;
    height: 36px;
    justify-self: end;
    border-radius: 50%;
    border: 2px solid #8d7353;
    display: grid;
    place-items: center;
    color: var(--ink);
    background: transparent;
  }

  .tick svg { display: block; opacity: 0; }

  .set.is-done .tick {
    background: var(--amber);
    border-color: var(--amber);
  }

  .set.is-done .tick svg { opacity: 1; }

  .block {
    margin-top: 16px;
    padding: 8px 16px 16px;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .seq-label {
    margin: 10px 0 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--amber-2);
  }

  .notes, .seq {
    list-style: none;
    margin: 4px 0 0;
    padding: 0;
  }

  .seq { counter-reset: pose; }

  .notes li, .seq li {
    min-height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 2px;
    border-top: 1px solid var(--line-soft);
    font-size: 17px;
    line-height: 1.35;
  }

  .notes li:first-child, .seq li:first-child { border-top: 0; }

  .notes li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    flex: none;
  }

  .seq li::before {
    counter-increment: pose;
    content: counter(pose);
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: #2c241c;
    color: var(--amber-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    flex: none;
  }

  .block-done {
    width: 100%;
    min-height: 64px;
    margin-top: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 0;
    border-radius: 16px;
    background: var(--amber);
    color: var(--ink);
    font-size: 18px;
    font-weight: 800;
  }

  .block-done .tick {
    width: 30px;
    height: 30px;
    justify-self: auto;
    border-color: var(--ink);
  }

  .block-done.is-done {
    background: transparent;
    color: var(--amber-2);
    box-shadow: inset 0 0 0 2px var(--amber);
  }

  .block-done.is-done .tick {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--ink);
  }

  .block-done.is-done .tick svg { opacity: 1; }

  .block-done:active { transform: scale(0.99); }

  .rest {
    margin-top: 18px;
    padding: 32px 20px 28px;
    border-radius: 22px;
    text-align: center;
    background: var(--card);
    border: 1px dashed #6a5438;
  }

  .pause {
    width: 88px;
    height: 88px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .pause span {
    width: 8px;
    height: 28px;
    border-radius: 4px;
    background: var(--amber);
  }

  .rest .lede { margin: 0; }

  .next {
    margin: 14px 0 0;
    font-size: 17px;
    font-weight: 800;
    color: var(--amber-2);
  }

  .banner {
    margin: 18px 0 0;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(255, 159, 26, 0.16);
    color: #ffd48a;
    font-size: 17px;
    font-weight: 800;
    text-align: center;
  }

  .reset {
    width: 100%;
    margin-top: 14px;
    min-height: 56px;
    border-radius: 16px;
    border: 1px solid #6a5438;
    background: transparent;
    color: #f0d7b4;
    font-size: 17px;
    font-weight: 700;
  }

  .reset.is-armed {
    border-color: var(--amber);
    background: rgba(255, 159, 26, 0.14);
    color: #ffc14d;
  }

  .reset:disabled { opacity: 0.38; cursor: default; }

  .prior {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .prior-title {
    margin: 2px 2px 0;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.3;
    color: var(--amber-2);
  }

  .prior-set {
    grid-template-columns: 40px minmax(0, 1fr) auto;
    column-gap: 10px;
  }

  .prior-kg {
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
    padding-right: 4px;
  }

  .backup-note {
    margin: 10px 0 0;
    text-align: center;
    font-size: 15px;
    font-weight: 800;
    color: var(--amber-2);
  }

  .import-hit {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .import-hit .file-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .plan-line {
    margin: 4px 0 0;
    font-size: 14px;
    font-weight: 800;
    color: var(--soft);
  }

  .views {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 0 0 14px;
  }

  .view-btn {
    min-height: 48px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card-2);
    font-size: 16px;
    font-weight: 800;
  }

  .view-btn[aria-pressed="true"] {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--ink);
  }

  .save-session {
    width: 100%;
    min-height: 64px;
    margin-top: 14px;
    padding: 12px 16px;
    border: 0;
    border-radius: 16px;
    background: var(--amber);
    color: var(--ink);
    font-size: 18px;
    font-weight: 800;
  }

  .save-session.is-armed {
    background: transparent;
    color: #ffc14d;
    box-shadow: inset 0 0 0 2px var(--amber);
  }

  .save-session:active { transform: scale(0.99); }

  .tools { margin-top: 8px; }

  .history h2 { margin-top: 0; }

  .history h3 {
    margin: 22px 0 0;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  .section-help {
    margin: 6px 0 0;
    font-size: 15px;
    line-height: 1.4;
    color: var(--soft);
    font-weight: 700;
  }

  .hist-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }

  .hist-item {
    width: 100%;
    min-height: 72px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    text-align: left;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--card);
  }

  .hist-item:active { background: #221c17; }

  .hist-meta {
    font-size: 15px;
    font-weight: 700;
    color: var(--soft);
    line-height: 1.3;
  }

  .field-label {
    display: block;
    margin-top: 12px;
    font-size: 15px;
    font-weight: 800;
    color: var(--muted);
  }

  .select {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #2c241c;
    color: var(--text);
    font: inherit;
    font-weight: 700;
  }

  .chart-card {
    margin-top: 12px;
    padding: 12px 12px 8px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .chart-card svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .chart-caption {
    margin: 8px 0 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--soft);
  }

  .evo-list {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
  }

  .evo-list li {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 8px 0;
    border-top: 1px solid var(--line-soft);
    font-size: 15px;
    line-height: 1.35;
  }

  .evo-kg {
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .back-btn { margin-top: 0; margin-bottom: 8px; }

  .history .ex,
  .history .lede,
  .gate-card .lede { overflow-wrap: anywhere; }

  .gate {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(8, 6, 5, 0.76);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
  }

  .gate[hidden] { display: none; }

  .gate-card {
    width: min(100%, 480px);
    margin-bottom: env(safe-area-inset-bottom);
    padding: 18px 16px 16px;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .gate-card h2 { font-size: 26px; }

  .gate-apply:disabled { opacity: 0.38; cursor: default; }

  @media (hover: hover) {
    .day:not([aria-selected="true"]):hover { background: #2e261f; }
    .set-toggle:hover { background: rgba(255, 159, 26, 0.06); }
    .reset:not(:disabled):hover { border-color: var(--amber-2); }
    .view-btn:not([aria-pressed="true"]):hover { border-color: var(--amber-2); }
    .hist-item:hover { border-color: var(--amber); }
  }

  @media (max-width: 359px) {
    .days { gap: 4px; }
    .day { border-radius: 12px; min-height: 60px; }
    h1 { font-size: 34px; }
    h2 { font-size: 26px; }
    .ex { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="ident">
      <div class="orb" aria-hidden="true">D</div>
      <div>
        <h1>Dor<span class="ia">IA</span>n</h1>
        <p class="goal">Objetivo actual: mantenerse</p>
        <p class="plan-line" id="plan-line"></p>
      </div>
    </header>
    <nav class="views" aria-label="Secciones">
      <button class="view-btn" type="button" id="view-train" aria-pressed="true">Entreno</button>
      <button class="view-btn" type="button" id="view-history" aria-pressed="false">Historial</button>
    </nav>
    <div class="week">
      <p class="week-label" id="week-label"></p>
      <div class="days" id="days" role="tablist" aria-label="Días de la semana"></div>
    </div>
    <main id="panel" role="tabpanel" tabindex="-1"></main>
    <div id="history" class="history" hidden></div>
    <div class="tools">
      <label class="reset import-hit" id="load-plan">Cargar plan<input id="plan-file" class="file-input" type="file" accept="application/json,.json"></label>
      <button class="reset" type="button" id="export-backup">Exportar copia</button>
      <label class="reset import-hit" id="import-backup">Importar copia<input id="import-file" class="file-input" type="file" accept="application/json,.json"></label>
      <p id="backup-note" class="backup-note" role="status" hidden></p>
    </div>
    <div id="plan-gate" class="gate" hidden>
      <div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gate-title">
        <h2 id="gate-title">Copia obligatoria</h2>
        <p class="lede" id="gate-text"></p>
        <button class="block-done" type="button" id="gate-download">Descargar copia</button>
        <button class="block-done gate-apply" type="button" id="gate-apply" disabled>Aplicar plan</button>
        <button class="reset" type="button" id="gate-cancel">Cancelar</button>
        <p id="gate-note" class="backup-note" role="status" hidden></p>
      </div>
    </div>
    <noscript><p class="lede">Activa JavaScript para ver la sesión de hoy.</p></noscript>
  </div>
  <script>
(function () {
  "use strict";

  // Rules: never change STORAGE_KEY, never reuse an id for a different exercise, new exercise = new id.

  function el(tag, opts) {
    var node = document.createElement(tag);
    var options = opts || {};
    Object.keys(options).forEach(function (key) {
      var value = options[key];
      if (value == null || value === false) return;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else node.setAttribute(key, value === true ? "" : String(value));
    });
    return node;
  }

  function madridToday() {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "Europe/Madrid",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    function grab(type) {
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === type) return parts[i].value;
      }
      return "";
    }
    var month = grab("month").padStart(2, "0");
    var day = grab("day").padStart(2, "0");
    return grab("year") + "-" + month + "-" + day;
  }

  function parseYmd(ymd) {
    var bits = ymd.split("-");
    return { y: Number(bits[0]), m: Number(bits[1]), d: Number(bits[2]) };
  }

  function addDays(ymd, amount) {
    var p = parseYmd(ymd);
    var dt = new Date(Date.UTC(p.y, p.m - 1, p.d + amount));
    var month = String(dt.getUTCMonth() + 1).padStart(2, "0");
    var day = String(dt.getUTCDate()).padStart(2, "0");
    return dt.getUTCFullYear() + "-" + month + "-" + day;
  }

  function weekdaySun0(ymd) {
    var p = parseYmd(ymd);
    return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
  }

  function mondayOf(ymd) {
    var w = weekdaySun0(ymd);
    return addDays(ymd, w === 0 ? -6 : 1 - w);
  }

  function formatLong(ymd) {
    var p = parseYmd(ymd);
    var dt = new Date(Date.UTC(p.y, p.m - 1, p.d, 12));
    var text = new Intl.DateTimeFormat("es-ES", {
      timeZone: "UTC",
      weekday: "long",
      day: "numeric",
      month: "long"
    }).format(dt);
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function formatDayMonth(ymd) {
    var p = parseYmd(ymd);
    var dt = new Date(Date.UTC(p.y, p.m - 1, p.d, 12));
    return new Intl.DateTimeFormat("es-ES", {
      timeZone: "UTC",
      day: "numeric",
      month: "long"
    }).format(dt);
  }

  function readStore() {
    if (memory) return memory;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      memory = parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
    } catch (err) {
      memory = {};
    }
    return memory;
  }

  function writeStore() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(readStore()));
    } catch (err) {}
  }

  function isMetaKey(key) {
    return typeof key === "string" && key.charAt(0) === "_";
  }

  function rawDay(ymd) {
    var all = readStore();
    var day = all[ymd];
    if (!day || typeof day !== "object" || Array.isArray(day)) return {};
    return day;
  }

  function marks(ymd) {
    var day = rawDay(ymd);
    var out = {};
    Object.keys(day).forEach(function (key) {
      if (isMetaKey(key)) return;
      out[key] = day[key];
    });
    return out;
  }

  function setDone(ymd, id, on) {
    if (isMetaKey(id)) return;
    var all = readStore();
    if (!all[ymd] || typeof all[ymd] !== "object" || Array.isArray(all[ymd])) all[ymd] = {};
    if (on) all[ymd][id] = true;
    else delete all[ymd][id];
    if (!Object.keys(all[ymd]).length) delete all[ymd];
    writeStore();
  }

  function kgKey(id) {
    return id + ":kg";
  }

  function readKg(dayMap, id) {
    var raw = dayMap[kgKey(id)];
    if (typeof raw === "number" && isFinite(raw) && raw >= 0) return raw;
    if (typeof raw === "string" && raw.trim() !== "") {
      var n = Number(raw.replace(",", "."));
      if (isFinite(n) && n >= 0) return n;
    }
    return null;
  }

  function exerciseIdFromSetId(setId) {
    var base = String(setId || "");
    var dash = base.lastIndexOf("-");
    if (dash <= 0) return base;
    return base.slice(0, dash);
  }

  function setKg(ymd, id, kg, name) {
    if (isMetaKey(id)) return;
    var all = readStore();
    if (!all[ymd] || typeof all[ymd] !== "object" || Array.isArray(all[ymd])) all[ymd] = {};
    var key = kgKey(id);
    if (kg == null) delete all[ymd][key];
    else all[ymd][key] = kg;
    if (kg != null && name) {
      var exerciseId = exerciseIdFromSetId(id);
      if (exerciseId && !isMetaKey(exerciseId)) all[ymd]["_n:" + exerciseId] = name;
    }
    if (!Object.keys(all[ymd]).length) delete all[ymd];
    writeStore();
  }

  function parseKgInput(value) {
    var text = String(value == null ? "" : value).trim().replace(",", ".");
    if (!text) return null;
    var n = Number(text);
    if (!isFinite(n) || n < 0) return null;
    // keep one decimal when needed (e.g. 62.5)
    return Math.round(n * 4) / 4;
  }

  function formatKg(n) {
    if (n == null) return "";
    return Number.isInteger(n) ? String(n) : String(n);
  }

  function lastSavedKgFor(ids, setNum, skipYmd) {
    var all = readStore();
    var days = Object.keys(all).sort();
    var exact = null;
    var any = null;
    for (var i = days.length - 1; i >= 0; i--) {
      var ymd = days[i];
      if (ymd === skipYmd) continue;
      var day = all[ymd];
      if (!day || typeof day !== "object" || Array.isArray(day)) continue;
      var same = null;
      for (var k = 0; k < ids.length; k++) {
        same = readKg(day, ids[k] + "-" + setNum);
        if (same != null) break;
      }
      if (same != null) {
        exact = same;
        break;
      }
      if (any == null) {
        for (var a = 0; a < ids.length && any == null; a++) {
          for (var s = SETS; s >= 1; s--) {
            var found = readKg(day, ids[a] + "-" + s);
            if (found != null) {
              any = found;
              break;
            }
          }
        }
      }
    }
    return exact != null ? exact : any;
  }

  function lastSavedKg(exerciseId, setNum, skipYmd) {
    var same = lastSavedKgFor([exerciseId], setNum, skipYmd);
    if (same != null) return same;
    var extra = REF_ALIAS[exerciseId];
    if (!extra || !extra.length) return null;
    return lastSavedKgFor(extra, setNum, skipYmd);
  }

  function dayHasData(ymd) {
    var day = rawDay(ymd);
    var keys = Object.keys(day);
    for (var i = 0; i < keys.length; i++) {
      if (!isMetaKey(keys[i])) return true;
    }
    return false;
  }

  function clearDay(ymd) {
    var all = readStore();
    delete all[ymd];
    writeStore();
  }

  function makeTick() {
    var span = el("span", { class: "tick", "aria-hidden": "true" });
    span.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.2 16.8 19 7.2"></path></svg>';
    return span;
  }

  function disarm() {
    armed = false;
    window.clearTimeout(armTimer);
    armTimer = 0;

  function buildDays() {
    var monday = mondayOf(today);
    weekLabel.textContent = "Semana del " + formatDayMonth(monday);
    for (var i = 0; i < 7; i++) {
      var ymd = addDays(monday, i);
      var w = weekdaySun0(ymd);
      var btn = el("button", {
        class: "day",
        type: "button",
        id: "tab-" + ymd,
        role: "tab",
        "aria-controls": "panel",
        "aria-label": formatLong(ymd) + (ymd === today ? ", hoy" : "")
      });
      btn.dataset.ymd = ymd;
      if (ymd === today) btn.setAttribute("aria-current", "date");
      btn.appendChild(el("span", { class: "dow", text: SHORT[w] }));
      btn.appendChild(el("span", { class: "num", text: String(Number(ymd.slice(8))) }));
      daysEl.appendChild(btn);
    }
  }

  function paintDays() {
    var tabs = daysEl.querySelectorAll('[role="tab"]');
    var current = null;
    for (var i = 0; i < tabs.length; i++) {
      var on = tabs[i].dataset.ymd === selected;
      tabs[i].setAttribute("aria-selected", on ? "true" : "false");
      tabs[i].tabIndex = on ? 0 : -1;
      if (on) current = tabs[i];
    }
    if (current) panel.setAttribute("aria-labelledby", current.id);

  function renderRest(day) {
    var card = el("div", { class: "rest" });
    var icon = el("div", { class: "pause", "aria-hidden": "true" });

  function renderGym(day, ymd) {
    var wrap = el("div", { class: "lifts" });
    var doneMap = marks(ymd);
    day.exercises.forEach(function (exercise) {
      var group = el("div", { class: "group" });
      for (var set = 1; set <= SETS; set++) {
        var id = exercise.id + "-" + set;
        var on = doneMap[id] === true;
        var savedKg = readKg(doneMap, id);
        var refKg = savedKg == null ? lastSavedKg(exercise.id, set, ymd) : null;

        var row = el("div", { class: "set" + (on ? " is-done" : "") });

        var btn = el("button", {
          class: "set-toggle",
          type: "button",
          "data-track": "1",
          "data-id": id,
          "aria-pressed": on ? "true" : "false",
          "aria-label": exercise.name + ", serie " + set + ", " + exercise.rx
        });
        btn.appendChild(el("span", { class: "n", text: String(set) }));
        var body = el("span", { class: "body" });
        body.appendChild(el("span", { class: "ex", text: exercise.name }));
        body.appendChild(el("span", { class: "rx", text: exercise.rx }));
        btn.appendChild(body);
        btn.appendChild(makeTick());
        row.appendChild(btn);

        var weight = el("label", { class: "weight" });
        var input = el("input", {
          type: "number",
          inputmode: "decimal",
          min: "0",
          step: "0.5",
          "data-kg": "1",
          "data-id": id,
          "data-name": exercise.name,
          "aria-label": "Peso en kg, " + exercise.name + ", serie " + set
        });
        if (savedKg != null) input.value = formatKg(savedKg);
        else if (refKg != null) input.setAttribute("placeholder", formatKg(refKg));
        else input.setAttribute("placeholder", "—");
        weight.appendChild(input);
        weight.appendChild(el("span", { class: "unit", text: "kg", "aria-hidden": "true" }));
        row.appendChild(weight);

        group.appendChild(row);
      }
      wrap.appendChild(group);
    });
    var prior = renderPrior(day.exercises, ymd);
    if (prior) wrap.appendChild(prior);
    return wrap;
  }

  function parseStoredSetKey(key) {
    if (isMetaKey(key)) return null;
    var isKg = key.length > 3 && key.slice(-3) === ":kg";
    var base = isKg ? key.slice(0, -3) : key;
    var dash = base.lastIndexOf("-");
    if (dash <= 0) return null;
    var setText = base.slice(dash + 1);
    if (!/^[1-9]\d*$/.test(setText)) return null;
    return { exerciseId: base.slice(0, dash), setNum: Number(setText), isKg: isKg };
  }

  function storedExerciseName(dayMap, exerciseId) {
    if (Object.prototype.hasOwnProperty.call(RETIRED, exerciseId)) return RETIRED[exerciseId];
    var stored = dayMap["_n:" + exerciseId];
    if (typeof stored === "string" && stored.trim()) return stored.trim();
    return exerciseId;
  }

  function renderPrior(exercises, ymd) {
    var dayMap = rawDay(ymd);
    var current = {};
    exercises.forEach(function (exercise) {
      current[exercise.id] = true;
    });
    var grouped = {};
    var order = [];
    Object.keys(dayMap).forEach(function (key) {
      var parsed = parseStoredSetKey(key);
      if (!parsed || current[parsed.exerciseId]) return;
      if (!grouped[parsed.exerciseId]) {
        grouped[parsed.exerciseId] = {};
        order.push(parsed.exerciseId);
      }
      var sets = grouped[parsed.exerciseId];
      if (!sets[parsed.setNum]) sets[parsed.setNum] = { kg: null };
      if (parsed.isKg) {
        var kg = readKg(dayMap, parsed.exerciseId + "-" + parsed.setNum);
        if (kg != null) sets[parsed.setNum].kg = kg;
      }
    });
    if (!order.length) return null;

    var section = el("section", { class: "prior" });
    section.appendChild(el("h3", { class: "prior-title", text: "Registrado con el plan anterior" }));
    order.forEach(function (exerciseId) {
      var name = storedExerciseName(dayMap, exerciseId);
      var group = el("div", { class: "group prior-group" });
      var setNums = Object.keys(grouped[exerciseId]).map(Number).sort(function (a, b) { return a - b; });
      setNums.forEach(function (setNum) {
        var slot = grouped[exerciseId][setNum];
        var row = el("div", { class: "set prior-set" });
        row.appendChild(el("span", { class: "n", text: String(setNum) }));
        var body = el("span", { class: "body" });
        body.appendChild(el("span", { class: "ex", text: name }));
        body.appendChild(el("span", { class: "rx", text: "Serie " + setNum }));
        row.appendChild(body);
        var kgText = slot.kg != null ? formatKg(slot.kg) + " kg" : "—";
        row.appendChild(el("span", { class: "prior-kg", text: kgText }));
        group.appendChild(row);
      });
      section.appendChild(group);
    });
    return section;
  }

  function renderBlock(day, ymd) {
    var card = el("div", { class: "block" });
    if (day.sequence) card.appendChild(el("p", { class: "seq-label", text: "Secuencia" }));
    var list = el(day.sequence ? "ol" : "ul", { class: day.sequence ? "seq" : "notes" });
    day.steps.forEach(function (step) {
      list.appendChild(el("li", { text: step }));
    });
    card.appendChild(list);
    var on = marks(ymd).session === true;
    var btn = el("button", {
      class: "block-done" + (on ? " is-done" : ""),
      type: "button",
      "data-track": "1",
      "data-id": "session",
      "aria-pressed": on ? "true" : "false"
    });
    btn.appendChild(makeTick());
    btn.appendChild(el("span", { class: "btn-label", text: on ? "Sesión hecha" : "Marcar sesión hecha" }));
    card.appendChild(btn);
    return card;
  }

  function renderPanel() {
    var ymd = selected;
    var day = dayPlan(ymd);
    panel.dataset.kind = day.kind;
    panel.replaceChildren();
    disarmSave();

    var when = formatLong(ymd);
    if (ymd === today) when += " · hoy";
    panel.appendChild(el("p", { class: "when", text: when }));

    var head = el("div", { class: "head" });
    var tags = el("div", { class: "tags" });
    tags.appendChild(el("p", { class: "kicker", text: day.kicker }));
    tags.appendChild(el("p", { class: "chip", text: day.chip }));
    head.appendChild(tags);
    head.appendChild(el("h2", { text: day.title }));
    if (day.kind !== "rest") head.appendChild(el("p", { class: "lede", text: day.lede }));
    panel.appendChild(head);

    if (day.kind === "rest") {
      panel.appendChild(renderRest(day));
      return;
    }

    var bar = el("div", { class: "bar", "aria-hidden": "true" });
    bar.appendChild(el("span"));
    panel.appendChild(bar);
    panel.appendChild(el("p", { class: "count" }));

    panel.appendChild(day.kind === "gym" ? renderGym(day, ymd) : renderBlock(day, ymd));

    var banner = el("p", { class: "banner", text: "Sesión completa" });
    banner.hidden = true;
    banner.setAttribute("aria-live", "polite");
    panel.appendChild(banner);

    panel.appendChild(el("button", {
      class: "save-session",
      type: "button",
      "data-save": "1",
      text: sessionForDate(ymd) ? "Actualizar entrenamiento" : "Guardar entrenamiento"
    }));
    var saveNote = el("p", { class: "backup-note", "data-save-note": "1", role: "status" });
    saveNote.hidden = true;
    panel.appendChild(saveNote);

    panel.appendChild(el("button", {
      class: "reset",
      type: "button",
      "data-reset": "1",
      text: "Reiniciar este día"
    }));

    paintChrome();
  }

  function paintChrome() {
    var buttons = panel.querySelectorAll("[data-track]");
    var done = 0;
    var total = 0;
    for (var i = 0; i < buttons.length; i++) {
      var trackId = buttons[i].getAttribute("data-id") || "";
      if (isMetaKey(trackId)) continue;
      total += 1;
      if (buttons[i].getAttribute("aria-pressed") === "true") done += 1;
    }
    var count = panel.querySelector(".count");
    var fill = panel.querySelector(".bar > span");
    if (count && total) {
      count.textContent = panel.dataset.kind === "block"
        ? (done ? "Sesión hecha" : "Pendiente")
        : (done + " de " + total + " series");
    }
    if (fill && total) fill.style.width = Math.round((done / total) * 100) + "%";

    var banner = panel.querySelector(".banner");
    if (banner) banner.hidden = !(total > 0 && done === total);

    var groups = panel.querySelectorAll(".group");
    for (var g = 0; g < groups.length; g++) {
      var sets = groups[g].querySelectorAll("[data-track]");
      var tracked = 0;
      var complete = true;
      for (var s = 0; s < sets.length; s++) {
        var setId = sets[s].getAttribute("data-id") || "";
        if (isMetaKey(setId)) continue;
        tracked += 1;
        if (sets[s].getAttribute("aria-pressed") !== "true") complete = false;
      }
      groups[g].classList.toggle("is-complete", tracked > 0 && complete);
    }

    var resetBtn = panel.querySelector("[data-reset]");
    if (resetBtn) {
      var hasData = dayHasData(selected);
      if (!hasData) disarm();
      resetBtn.disabled = !hasData;
      resetBtn.textContent = armed ? ("¿Seguro? Borra el " + NAME[weekdaySun0(selected)]) : "Reiniciar este día";
      resetBtn.classList.toggle("is-armed", armed);
    }
  }

  function onReset(btn) {

      armTimer = window.setTimeout(function () {

  daysEl.addEventListener("click", function (event) {
    var tab = event.target.closest('[role="tab"]');

    disarmSave();

  });

  daysEl.addEventListener("keydown", function (event) {
    var keys = ["ArrowRight", "ArrowLeft", "Home", "End"];
    if (keys.indexOf(event.key) === -1) return;
    var tabs = Array.prototype.slice.call(daysEl.querySelectorAll('[role="tab"]'));
    var index = tabs.indexOf(document.activeElement);
    if (index < 0) return;
    event.preventDefault();
    var next = index;
    if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
    if (event.key === "ArrowLeft") next = (index + tabs.length - 1) % tabs.length;
    if (event.key === "Home") next = 0;
    if (event.key === "End") next = tabs.length - 1;
    tabs[next].focus();
    tabs[next].click();
  });

  panel.addEventListener("click", function (event) {

    if (track && panel.contains(track)) {
      var on = track.getAttribute("aria-pressed") !== "true";
      setDone(selected, track.dataset.id, on);
      track.setAttribute("aria-pressed", on ? "true" : "false");
      var row = track.closest(".set");
      if (row) row.classList.toggle("is-done", on);
      else track.classList.toggle("is-done", on);
